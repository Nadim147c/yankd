name: Nix Flack Check and Build
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go Mod Download
        run: go mod download

      - name: Go Mod Tidy
        run: nix run .#ci-go-mod-tidy

      - name: Format
        run: nix run .#ci-format

      - name: Go Lint
        run: nix run .#ci-go-lint

      - name: Go Tests
        run: nix run .#ci-go-test

      - name: Go Vet
        run: nix run .#ci-go-vet

      - name: Nix Build
        run: nix build .#yankd
