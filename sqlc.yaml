version: "2"
sql:
  - schema: "./internal/db/sqlc/migrations"
    queries: "./internal/db/sqlc/queries"
    engine: "sqlite"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db/sqlc"
        emit_db_tags: true
        emit_json_tags: true
        emit_all_enum_values: true
        emit_sql_as_comment: true
        emit_empty_slices: true
        overrides:
          - db_type: datetime
            go_type: time.Time
          - column: "*.best_rank"
            go_type: int64
          - column: contents.hash
            go_type:
              import: github.com/Nadim147c/yankd/internal/models
              type: Hash
          - column: contents.text
            go_type:
              import: github.com/Nadim147c/yankd/internal/models
              type: NullString
